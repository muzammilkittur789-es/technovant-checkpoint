<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1147" />
      <stop offset="60%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#aiBg)" />

  <!-- Neural Net nodes and links -->
  <g stroke="#a855f7" stroke-opacity="0.3" stroke-width="2">
    <line x1="200" y1="160" x2="380" y2="120" />
    <line x1="200" y1="225" x2="380" y2="225" />
    <line x1="200" y1="290" x2="380" y2="330" />
    <line x1="200" y1="160" x2="380" y2="225" />
    <line x1="200" y1="290" x2="380" y2="225" />
    <line x1="380" y1="120" x2="560" y2="225" />
    <line x1="380" y1="225" x2="560" y2="225" />
    <line x1="380" y1="330" x2="560" y2="225" />
  </g>

  <!-- Left: Unstructured raw inputs -->
  <g transform="translate(100, 110)">
    <rect width="130" height="42" rx="8" fill="#3b0764" stroke="#c084fc" stroke-width="1.5" />
    <text x="18" y="26" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Vendor PDF Invoices</text>

    <rect y="60" width="130" height="42" rx="8" fill="#3b0764" stroke="#c084fc" stroke-width="1.5" />
    <text x="18" y="86" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Support Emails</text>

    <rect y="120" width="130" height="42" rx="8" fill="#3b0764" stroke="#c084fc" stroke-width="1.5" />
    <text x="18" y="146" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Contracts &amp; Audits</text>
  </g>

  <!-- Center: LLM Parser Engine -->
  <g transform="translate(320, 160)">
    <rect width="160" height="130" rx="16" fill="#581c87" stroke="#d8b4fe" stroke-width="2" />
    <circle cx="80" cy="50" r="24" fill="#7e22ce" />
    <text x="56" y="56" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">AI</text>
    <text x="25" y="98" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">SEMANTIC PARSER</text>
    <text x="26" y="114" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="10">Zero Data Retention</text>
  </g>

  <!-- Right: Structured JSON Output -->
  <g transform="translate(560, 150)">
    <rect width="160" height="150" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    <rect x="15" y="20" width="130" height="18" rx="4" fill="#064e3b" />
    <text x="25" y="33" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">VALIDATED JSON</text>
    
    <text x="18" y="65" fill="#a7f3d0" font-family="monospace" font-size="10">&#123;</text>
    <text x="28" y="85" fill="#e2e8f0" font-family="monospace" font-size="10">&quot;total&quot;: 1450.00,</text>
    <text x="28" y="105" fill="#e2e8f0" font-family="monospace" font-size="10">&quot;triage&quot;: &quot;urgent&quot;,</text>
    <text x="28" y="125" fill="#e2e8f0" font-family="monospace" font-size="10">&quot;status&quot;: &quot;approved&quot;</text>
    <text x="18" y="142" fill="#a7f3d0" font-family="monospace" font-size="10">&#125;</text>
  </g>
</svg>
