<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="autoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#autoBg)" />

  <!-- Flow pipeline connector lines -->
  <path d="M 160 225 L 300 225 L 380 150 L 500 150 L 580 225 L 680 225" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6,6" opacity="0.6" />
  <path d="M 300 225 L 380 300 L 500 300 L 580 225" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Node 1: Webhook Trigger -->
  <g transform="translate(80, 180)">
    <rect width="160" height="90" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2" />
    <circle cx="30" cy="45" r="14" fill="#10b981" />
    <text x="55" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">TRIGGER</text>
    <text x="55" y="58" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Inbound Webhook</text>
  </g>

  <!-- Node 2: Logic Evaluation -->
  <g transform="translate(340, 105)">
    <rect width="180" height="90" rx="14" fill="#042f2e" stroke="#34d399" stroke-width="2" />
    <circle cx="32" cy="45" r="14" fill="#14b8a6" />
    <text x="58" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">FILTER &amp; PARSE</text>
    <text x="58" y="58" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="11">Data Validation</text>
  </g>

  <!-- Node 3: AI Enrichment -->
  <g transform="translate(340, 255)">
    <rect width="180" height="90" rx="14" fill="#042f2e" stroke="#38bdf8" stroke-width="2" />
    <circle cx="32" cy="45" r="14" fill="#0284c7" />
    <text x="58" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ENRICHMENT</text>
    <text x="58" y="58" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11">CRM Sync &amp; Route</text>
  </g>

  <!-- Node 4: Executed Result -->
  <g transform="translate(600, 180)">
    <rect width="150" height="90" rx="14" fill="url(#emeraldGrad)" />
    <text x="25" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">AUTONOMOUS</text>
    <text x="25" y="60" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="11">Zero Human Friction</text>
  </g>
</svg>
