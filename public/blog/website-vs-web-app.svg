<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#webBg)" />

  <!-- Left: Content Website Browser Wireframe -->
  <g transform="translate(100, 90)">
    <rect width="260" height="270" rx="14" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <path d="M 0 0 L 260 0 L 260 36 L 0 36 Z" fill="#334155" rx="14" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="75" y="22" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">company-website.com</text>

    <!-- Marketing content mockup -->
    <rect x="25" y="55" width="210" height="24" rx="4" fill="#38bdf8" fill-opacity="0.3" />
    <rect x="25" y="90" width="160" height="12" rx="3" fill="#64748b" />
    <rect x="25" y="110" width="190" height="12" rx="3" fill="#64748b" />
    <rect x="25" y="135" width="90" height="28" rx="6" fill="#0284c7" />
    <rect x="25" y="180" width="210" height="60" rx="6" fill="#0f172a" />

    <text x="50" y="295" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">STATIC / MARKETING</text>
  </g>

  <!-- Right: Dynamic Stateful Web App Wireframe -->
  <g transform="translate(440, 90)">
    <rect width="260" height="270" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <path d="M 0 0 L 260 0 L 260 36 L 0 36 Z" fill="#312e81" rx="14" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="75" y="22" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10">app.platform.io/dashboard</text>

    <!-- App UI Mockup (Sidebar + Tables + Interactive State) -->
    <rect x="15" y="50" width="55" height="190" rx="6" fill="#0f172a" />
    <rect x="80" y="50" width="165" height="40" rx="6" fill="#4338ca" fill-opacity="0.4" stroke="#6366f1" stroke-width="1" />
    
    <rect x="80" y="100" width="165" height="26" rx="4" fill="#0f172a" />
    <rect x="80" y="135" width="165" height="26" rx="4" fill="#0f172a" />
    <rect x="80" y="170" width="165" height="26" rx="4" fill="#0f172a" />
    <rect x="80" y="205" width="80" height="26" rx="6" fill="#4f46e5" />

    <text x="45" y="295" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">TRANSACTIONAL WEB APP</text>
  </g>
</svg>
