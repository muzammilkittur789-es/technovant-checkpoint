<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid lines -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Left: Off-the-Shelf Rigid Box -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="220" height="230" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="20" y="24" width="180" height="32" rx="8" fill="#334155" />
    <text x="35" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">OFF-THE-SHELF (COTS)</text>
    
    <!-- Rigid Rows -->
    <rect x="20" y="75" width="180" height="24" rx="6" fill="#0f172a" />
    <rect x="20" y="110" width="180" height="24" rx="6" fill="#0f172a" />
    <rect x="20" y="145" width="180" height="24" rx="6" fill="#0f172a" />
    
    <!-- Lock Badge -->
    <rect x="20" y="185" width="180" height="28" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-opacity="0.4" />
    <text x="45" y="203" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Per-Seat Licensing Lock-In</text>
  </g>

  <!-- VS divider badge -->
  <g transform="translate(375, 205)">
    <circle cx="25" cy="20" r="24" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <text x="16" y="26" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="14" font-weight="800">VS</text>
  </g>

  <!-- Right: Custom Modular Architecture -->
  <g transform="translate(440, 100)">
    <rect x="0" y="0" width="240" height="250" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <rect x="20" y="24" width="200" height="34" rx="8" fill="url(#blueGrad)" />
    <text x="38" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">CUSTOM ARCHITECTURE</text>
    
    <!-- Modular microservice blocks -->
    <rect x="20" y="75" width="95" height="48" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
    <text x="30" y="104" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Core Logic</text>

    <rect x="125" y="75" width="95" height="48" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.5" />
    <text x="135" y="104" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Private DB</text>

    <rect x="20" y="135" width="200" height="42" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <text x="35" y="161" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Proprietary API Connectors</text>

    <!-- Asset Ownership Badge -->
    <rect x="20" y="195" width="200" height="32" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" />
    <text x="42" y="215" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">100% Owned IP &amp; 0 Licensing</text>
  </g>
</svg>
