<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="saasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#saasBg)" />

  <!-- Multi-tenant Composable SaaS Stack Illustration -->
  <g transform="translate(120, 100)">
    <!-- Generic Suite Bloat -->
    <rect x="0" y="0" width="220" height="250" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="20" y="20" width="180" height="32" rx="6" fill="#334155" />
    <text x="35" y="41" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">MONOLITHIC SUITE</text>

    <text x="25" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; 85% Unused Features</text>
    <text x="25" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; Rigid Data Formats</text>
    <text x="25" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; High Per-Seat Surcharges</text>
    <text x="25" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">&bull; 6-Month Onboarding Curve</text>
  </g>

  <!-- Arrow -->
  <path d="M 380 225 L 430 225" stroke="#818cf8" stroke-width="4" stroke-linecap="round" />
  <polygon points="430,225 418,217 418,233" fill="#818cf8" />

  <!-- Right: Modern Vertical Modular Tools -->
  <g transform="translate(460, 80)">
    <!-- Specialized Tool 1 -->
    <rect x="0" y="0" width="220" height="75" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="20" y="32" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Domain-Specific SaaS</text>
    <text x="20" y="52" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10">Built for Exact Operational Cadence</text>

    <!-- Specialized Tool 2 -->
    <rect x="0" y="95" width="220" height="75" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="20" y="127" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Embedded Financial Rails</text>
    <text x="20" y="147" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10">Automated Billing &amp; Invoicing Sync</text>

    <!-- Specialized Tool 3 -->
    <rect x="0" y="190" width="220" height="75" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="20" y="222" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Standardized Open REST APIs</text>
    <text x="20" y="242" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="10">Zero Lock-In &amp; Clean Data Exports</text>
  </g>
</svg>
