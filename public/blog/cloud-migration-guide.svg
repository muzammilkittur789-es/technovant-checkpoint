<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="60%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#cloudBg)" />

  <!-- Cloud Outline Graphic -->
  <g transform="translate(240, 70)" stroke="#38bdf8" stroke-width="3" fill="#0369a1" fill-opacity="0.2">
    <path d="M 60 160 C 20 160, 0 130, 10 90 C 20 50, 70 40, 100 50 C 130 10, 200 10, 230 45 C 260 30, 310 50, 315 90 C 330 130, 305 160, 260 160 Z" />
  </g>

  <!-- Server Instances Inside Cloud -->
  <g transform="translate(300, 150)">
    <rect x="0" y="0" width="200" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="21" r="5" fill="#10b981" />
    <text x="38" y="26" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Autoscaling Cluster</text>

    <rect x="0" y="55" width="200" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="76" r="5" fill="#10b981" />
    <text x="38" y="81" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Managed Database (RDS)</text>

    <rect x="0" y="110" width="200" height="42" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="131" r="5" fill="#10b981" />
    <text x="38" y="136" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Encrypted Backup (S3)</text>
  </g>

  <!-- Ground Migration Arrow -->
  <g transform="translate(100, 270)">
    <rect x="0" y="0" width="130" height="60" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />
    <text x="18" y="35" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Legacy Server</text>
  </g>

  <path d="M 240 300 Q 280 300 295 240" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,6" />
  <polygon points="295,230 288,245 302,245" fill="#38bdf8" />
</svg>
