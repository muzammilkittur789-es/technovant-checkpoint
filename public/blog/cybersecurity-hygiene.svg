    <rect x="0" y="0" width="340" height="55" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="28" cy="27" r="10" fill="#10b981" />
    <text x="50" y="25" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">MFA Hardware / TOTP Enforced</text>
