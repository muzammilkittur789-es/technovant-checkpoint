    <rect x="0" y="70" width="340" height="55" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="28" cy="97" r="10" fill="#10b981" />
    <text x="50" y="95" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Least-Privilege RBAC Access</text>
    <text x="50" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Strict admin boundary limits per role</text>

    <!-- Layer 3 -->
    <rect x="0" y="140" width="340" height="55" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="28" cy="167" r="10" fill="#10b981" />
