<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0812" />
      <stop offset="60%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#secBg)" />

  <!-- Central Shield Graphic -->
  <g transform="translate(140, 100)">
    <path d="M 80 0 L 160 30 L 160 120 Q 160 210 80 250 Q 0 210 0 120 L 0 30 Z" fill="#881337" stroke="#fb7185" stroke-width="3" />
    
    <!-- Inner Lock Symbol -->
    <rect x="55" y="110" width="50" height="42" rx="6" fill="#f43f5e" />
    <path d="M 64 110 L 64 92 Q 64 74 80 74 Q 96 74 96 92 L 96 110" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
    <circle cx="80" cy="126" r="4" fill="#881337" />
    <line x1="80" y1="126" x2="80" y2="138" stroke="#881337" stroke-width="3" />
  </g>

  <!-- Hardening Defense Checklist on Right -->
  <g transform="translate(360, 90)">
