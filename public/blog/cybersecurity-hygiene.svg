    <rect x="0" y="210" width="340" height="55" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="28" cy="237" r="10" fill="#10b981" />
    <text x="50" y="235" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Encrypted Immutable Backups (WORM)</text>
    <text x="50" y="252" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Tested 30-day recovery objective</text>
